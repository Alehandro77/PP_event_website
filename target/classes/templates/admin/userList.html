<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление пользователями — Админ-панель</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f7;
            color: #1c1c1e;
            display: flex;
            min-height: 100vh;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 250px;
            background-color: #ffffff;
            border-right: 1px solid #e5e5ea;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar-logo {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #1c1c1e;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 32px;
            padding: 0 12px;
        }

        .sidebar-badge {
            background-color: #ff3b19;
            color: white;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .sidebar-nav {
            list-style: none;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            text-decoration: none;
            color: #636366;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .sidebar-nav a:hover {
            background-color: #f2f2f7;
            color: #1c1c1e;
        }

        .sidebar-nav a.active {
            background-color: #fff2f1;
            color: #ff3b19;
            font-weight: 600;
        }

        .sidebar-footer {
            border-top: 1px solid #e5e5ea;
            padding-top: 16px;
            margin-top: auto;
        }

        .logout-btn {
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            padding: 12px 16px;
            border-radius: 10px;
            color: #636366;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background-color: #fff2f1;
            color: #ff3b19;
        }

        /* --- Main Content --- */
        .main-content {
            flex: 1;
            margin-left: 250px;
            padding: 32px 40px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .page-title {
            font-size: 20px;
            font-weight: 700;
            color: #1c1c1e;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .content-title {
            font-size: 24px;
            font-weight: 700;
        }

        .total-count {
            font-size: 14px;
            color: #8e8e93;
        }

        .total-count span {
            color: #ff3b19;
            font-weight: 600;
        }

        /* --- Search Bar --- */
        .search-bar {
            background: #ffffff;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #e5e5ea;
            margin-bottom: 20px;
        }

        .search-form {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .search-form input,
        .search-form select {
            padding: 10px 14px;
            border: 1px solid #e5e5ea;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: #fafafa;
            color: #1c1c1e;
            transition: all 0.2s;
        }

        .search-form input:focus,
        .search-form select:focus {
            border-color: #ff3b19;
            background: #ffffff;
        }

        .search-form input[name="name"],
        .search-form input[name="email"] {
            flex: 1;
        }

        .search-form button {
            padding: 10px 20px;
            background-color: #ff3b19;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-form button:hover {
            background-color: #e02f0f;
        }

        /* --- Table --- */
        .table-container {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e5e5ea;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background-color: #fafafa;
            border-bottom: 1px solid #e5e5ea;
        }

        th {
            padding: 14px 20px;
            font-size: 12px;
            font-weight: 600;
            color: #8e8e93;
        }

        td {
            padding: 16px 20px;
            font-size: 14px;
            color: #1c1c1e;
            border-bottom: 1px solid #e5e5ea;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* Role Select Badges */
        .role-select {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid transparent;
            cursor: pointer;
            outline: none;
        }

        .role-select.ADMIN {
            background-color: #fff2f1;
            color: #ff3b19;
            border-color: #ffccc7;
        }

        .role-select.USER {
            background-color: #f2f2f7;
            color: #1c1c1e;
            border-color: #e5e5ea;
        }

        /* Actions */
        .btn-delete {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            color: #8e8e93;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background-color: #fff2f1;
            color: #ff3b19;
        }

        .btn-delete svg {
            width: 18px;
            height: 18px;
            display: block;
        }

        /* --- Pagination --- */
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background-color: #ffffff;
            border-top: 1px solid #e5e5ea;
        }

        .pagination-info {
            font-size: 13px;
            color: #8e8e93;
        }

        .pagination-controls {
            display: flex;
            gap: 6px;
        }

        .pagination-controls a,
        .pagination-controls span {
            padding: 6px 12px;
            border: 1px solid #e5e5ea;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            background: #ffffff;
            color: #1c1c1e;
            text-decoration: none;
            transition: all 0.2s;
        }

        .pagination-controls a:hover {
            background-color: #f2f2f7;
        }

        .pagination-controls .active {
            background-color: #ff3b19;
            color: #ffffff;
            border-color: #ff3b19;
        }

        .pagination-controls .disabled {
            color: #8e8e93;
            cursor: not-allowed;
        }

        /* --- Alerts --- */
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
        }

        .alert-success {
            background-color: #ebfbee;
            color: #2b8a3e;
            border: 1px solid #d3f9d8;
        }

        .alert-error {
            background-color: #fff0f0;
            color: #c92a2a;
            border: 1px solid #ffe3e3;
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
    <a th:href="@{/admin/}" class="sidebar-logo">
        ГОРОД N <span class="sidebar-badge">АДМИН</span>
    </a>

    <ul class="sidebar-nav">
        <li>
            <a th:href="@{/admin/}">
                <span class="icon">📊</span>
                Главная
            </a>
        </li>
        <li>
            <a th:href="@{/admin/events}">
                <span class="icon">📅</span>
                События
            </a>
        </li>
        <li>
            <a th:href="@{/admin/users}" class="active">
                <span class="icon">👥</span>
                Пользователи
            </a>
        </li>
    </ul>

    <div class="sidebar-footer">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-btn">
                <span class="icon">🚪</span>
                Выйти
            </button>
        </form>
    </div>
</aside>

<!-- Main Content -->
<main class="main-content">

    <div class="top-bar">
        <h1 class="page-title">Управление пользователями</h1>
    </div>

    <!-- Alert Messages -->
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <!-- Header Section -->
    <div class="content-header">
        <h2 class="content-title">Список пользователей</h2>
        <div class="total-count">
            Всего записей: <span th:text="${users.totalElements}">0</span>
        </div>
    </div>

    <!-- Search Bar -->
    <div class="search-bar">
        <form th:action="@{/admin/users}" method="get" class="search-form">
            <input type="text" name="name" placeholder="Поиск по имени..." th:value="${paramName}">
            <input type="text" name="email" placeholder="Email..." th:value="${paramEmail}">

            <select name="role">
                <option value="">Все роли</option>
                <option th:each="r : ${roles}"
                        th:value="${r.name()}"
                        th:text="${r.name()}"
                        th:selected="${paramRole == r.name()}">ROLE</option>
            </select>

            <button type="submit">Найти</button>
        </form>
    </div>

    <!-- Users Table -->
    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Имя участника</th>
                <th>Email</th>
                <th>Роль</th>
                <th>Дата регистрации</th>
                <th style="text-align: right;">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${users.isEmpty()}">
                <td colspan="6" style="text-align: center; padding: 40px; color: #8e8e93;">
                    Пользователи не найдены
                </td>
            </tr>

            <tr th:each="userItem : ${users.content}">
                <td th:text="${userItem.id}">1</td>
                <td style="font-weight: 600;" th:text="${userItem.name}">Имя</td>
                <td style="color: #636366;" th:text="${userItem.email}">email@example.com</td>
                <td>
                    <form th:action="@{/admin/users/update}" method="post" style="display: inline;">
                        <input type="hidden" name="id" th:value="${userItem.id}">
                        <select name="role"
                                class="role-select"
                                th:classappend="${userItem.role != null ? userItem.role.name() : ''}"
                                onchange="this.form.submit()">
                            <option th:each="r : ${roles}"
                                    th:value="${r.name()}"
                                    th:text="${r.name()}"
                                    th:selected="${userItem.role == r}">USER</option>
                        </select>
                    </form>
                </td>
                <td style="color: #636366;" th:text="${userItem.registrationDate != null ? userItem.registrationDate : '—'}">—</td>
                <td style="text-align: right;">
                    <form th:action="@{/admin/users/delete}" method="post" style="display: inline;"
                          onsubmit="return confirm('Вы уверены, что хотите удалить этого пользователя?');">
                        <input type="hidden" name="id" th:value="${userItem.id}">
                        <button type="submit" class="btn-delete" title="Удалить">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Pagination -->
        <div class="pagination" th:if="${users.totalPages > 0}">
            <div class="pagination-info">
                Страница <span th:text="${users.number + 1}">1</span> из <span th:text="${users.totalPages}">1</span>
            </div>

            <div class="pagination-controls">
                <a th:if="${users.hasPrevious()}"
                   th:href="@{/admin/users(page=${users.number - 1}, size=${users.size}, name=${paramName}, email=${paramEmail}, role=${paramRole})}">
                    Назад
                </a>
                <span th:unless="${users.hasPrevious()}" class="disabled">Назад</span>

                <th:block th:if="${users.totalPages > 0}">
                    <a th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}"
                       th:href="@{/admin/users(page=${i}, size=${users.size}, name=${paramName}, email=${paramEmail}, role=${paramRole})}"
                       th:text="${i + 1}"
                       th:classappend="${i == users.number} ? 'active' : ''">1</a>
                </th:block>

                <a th:if="${users.hasNext()}"
                   th:href="@{/admin/users(page=${users.number + 1}, size=${users.size}, name=${paramName}, email=${paramEmail}, role=${paramRole})}">
                    Вперед
                </a>
                <span th:unless="${users.hasNext()}" class="disabled">Вперед</span>
            </div>
        </div>
    </div>
</main>

</body>
</html>
