<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Управление пользователями</title>
</head>

<body>

<h1>Управление пользователями</h1>

<form method="get" action="/user">
    <input type="number" placeholder="id пользователя" name="id" required>
    <input type="submit" value="Найти">
</form>

<form method="get" action="/user">
    <input type="text" placeholder="email пользователя" name="email" required>
    <input type="submit" value="Найти">
</form>

<div th:if="${errorMessage}" th:text="${errorMessage}" style="color:red"></div>
<div th:if="${searchMessage}" th:text="${searchMessage}"></div>

<h2 th:if="${users != null and !users.isEmpty()}">Список пользователей</h2>

<div th:if="${users != null and !users.isEmpty()}">
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Имя</th>
            <th>Email</th>
            <th>Роль</th>
            <th>Регистрация</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr  th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.name}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.role}"></td>
            <td th:text="${user.registeredAt}"></td>
            <td>
                <form th:action="@{/admin/users/update}" method="post">
                    <input type="hidden" name="id" th:value="${user.id}"/>
                    <select name="role">
                        <option th:each="r : ${roles}"
                                th:value="${r}"
                                th:text="${r}"
                                th:selected="${r == user.role}">
                        </option>
                    </select>
                    <button type="submit">Изменить роль</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
