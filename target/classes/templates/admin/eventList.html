<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Управление событиями</title>
</head>
<body>

<h2>Поиск и фильтрация событий</h2>
<form th:action="@{/admin/events}" method="get">
    <div>
        <label for="title">Название:</label>
        <input type="text" id="title" name="title" th:value="${paramTitle}" placeholder="Название..." />

        <label for="description">Описание:</label>
        <input type="text" id="description" name="description" th:value="${paramDescription}" placeholder="Описание..." />

        <label for="category">Категория:</label>
        <input type="text" id="category" name="category" th:value="${paramCategory}" placeholder="Категория..." />
    </div>
    <br/>
    <div>
        <label for="location">Локация:</label>
        <input type="text" id="location" name="location" th:value="${paramLocation}" placeholder="Локация..." />

        <label for="eventDate">Дата:</label>
        <input type="date" id="eventDate" name="eventDate" th:value="${paramEventDate}" />

        <label for="eventTime">Время:</label>
        <input type="time" id="eventTime" name="eventTime" th:value="${paramEventTime}" />

        <label for="maxParticipants">Мин. мест:</label>
        <input type="number" id="maxParticipants" name="maxParticipants" th:value="${paramMaxParticipants}" placeholder="От..." />
    </div>
    <br/>
    <button type="submit">Найти</button>
    <a th:href="@{/admin/events}">Сбросить фильтры</a>
</form>

<hr/>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Название</th>
        <th>Категория</th>
        <!-- ИСПРАВЛЕНО: удалена лишняя цифра 1 после th:text -->
        <th>Дата</th>
        <th>Время</th>
        <th>Локация</th>
        <th>Мест</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="event : ${eventsPage.content}">
        <td th:text="${event.id}">1</td>
        <td th:text="${event.title}">Концерт</td>
        <td th:text="${event.category}">Музыка</td>
        <td th:text="${event.eventDate}">2026-10-15</td>
        <td th:text="${event.eventTime}">18:00</td>
        <td th:text="${event.location}">Москва</td>
        <td th:text="${event.maxParticipants}">100</td>
        <td>
            <form th:action="@{/admin/events/delete}" method="post">
                <input type="hidden" name="id" th:value="${event.id}" />
                <button type="submit">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<div th:if="${eventsPage.totalPages > 1}">
    <a th:if="${eventsPage.hasPrevious()}"
       th:href="@{/admin/events(page=${eventsPage.number - 1}, title=${paramTitle}, description=${paramDescription}, category=${paramCategory}, location=${paramLocation}, eventDate=${paramEventDate}, eventTime=${paramEventTime}, maxParticipants=${paramMaxParticipants})}">Назад</a>

    <span th:each="i : ${#numbers.sequence(0, eventsPage.totalPages - 1)}">
        <a th:href="@{/admin/events(page=${i}, title=${paramTitle}, description=${paramDescription}, category=${paramCategory}, location=${paramLocation}, eventDate=${paramEventDate}, eventTime=${paramEventTime}, maxParticipants=${paramMaxParticipants})}"
           th:text="${i + 1}"
           th:style="${i == eventsPage.number} ? 'font-weight: bold;' : ''">1</a>
    </span>

    <a th:if="${eventsPage.hasNext()}"
       th:href="@{/admin/events(page=${eventsPage.number + 1}, title=${paramTitle}, description=${paramDescription}, category=${paramCategory}, location=${paramLocation}, eventDate=${paramEventDate}, eventTime=${paramEventTime}, maxParticipants=${paramMaxParticipants})}">Вперед</a>
</div>

<hr/>

<h2>Добавить событие</h2>
<form th:action="@{/admin/events/add}" th:object="${eventModel}" method="post">
    <div>
        <label>Название:</label>
        <input type="text" th:field="*{title}" required />
    </div>
    <div>
        <label>Описание:</label>
        <textarea th:field="*{description}"></textarea>
    </div>
    <div>
        <label>Категория:</label>
        <input type="text" th:field="*{category}" required />
    </div>
    <div>
        <label>Дата:</label>
        <input type="date" th:field="*{eventDate}" required />
    </div>
    <div>
        <label>Время:</label>
        <input type="time" th:field="*{eventTime}" />
    </div>
    <div>
        <label>Локация:</label>
        <input type="text" th:field="*{location}" required />
    </div>
    <div>
        <label>Макс. мест:</label>
        <input type="number" th:field="*{maxParticipants}" required />
    </div>
    <button type="submit">Создать событие</button>
</form>

</body>
</html>
