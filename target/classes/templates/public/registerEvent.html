<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация на событие</title>
</head>
<body>

<div th:if="${errorMessage}" style="color:red; font-weight:bold;" th:text="${errorMessage}"></div>
<div th:if="${successMessage}" style="color:green; font-weight:bold;" th:text="${successMessage}"></div>

<div>
    <h1>Регистрация на событие</h1>
    <p>Название — <span th:text="${event.title}"></span></p>
    <p>Описание — <span th:text="${event.description}"></span></p>
    <p>Дата — <span th:text="${event.eventDate}"></span></p>
    <p>Время — <span th:text="${event.eventTime}"></span></p>
    <p>Локация — <span th:text="${event.location}"></span></p>
    <p>Всего мест — <span th:text="${event.maxParticipants}"></span></p>
    <p>
        Свободных мест —
        <span th:text="${freeSlots > 0 ? freeSlots : 'Мест нет'}"
              th:style="${freeSlots <= 0} ? 'color:red' : 'color:green'">
        </span>
    </p>
</div>

<div th:if="${freeSlots > 0}">
    <form th:action="@{/events/register}" method="post">
        <input type="hidden" name="eventId" th:value="${event.id}"/>
        <button type="submit">Зарегистрироваться</button>
    </form>
</div>

<div th:if="${freeSlots <= 0}">
    <p style="color:red;"><b>Регистрация закрыта — все места заняты</b></p>
</div>

<br/>
<a th:href="@{/}">← Назад к списку событий</a>

</body>
</html>
