<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление пользователями — Админ-панель</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/admin.css">
</head>
<body>

<aside class="sidebar">
    <a th:href="@{/admin/}" class="sidebar-logo">
        ГОРОД N <span class="sidebar-badge">АДМИН</span>
    </a>

    <ul class="sidebar-nav">
        <li>
            <a th:href="@{/admin/}">
                Главная
            </a>
        </li>
        <li>
            <a th:href="@{/admin/events}">
                События
            </a>
        </li>
        <li>
            <a th:href="@{/admin/users}" class="active">
                Пользователи
            </a>
        </li>
        <li>
            <a th:href="@{/admin/registrations}">
                Регистрации
            </a>
        </li>
    </ul>

    <div class="sidebar-footer">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-btn">
                Выйти
            </button>
        </form>
    </div>
</aside>

<main class="main-content">

    <div class="top-bar">
        <div class="page-title">Админ-панель Город N</div>
    </div>

    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>
    <div th:if="${searchMessage}" class="alert alert-info" th:text="${searchMessage}"></div>

    <div class="content-header">
        <h1 class="content-title">Управление пользователями</h1>
    </div>

    <!-- Поиск пользователей -->
    <div class="filter-card">
        <div class="search-forms-container">
            <form th:action="@{/admin/users}" method="get" class="search-form-inline">
                <input type="number" class="form-control" placeholder="ID пользователя" name="id" required>
                <button type="submit" class="btn-submit">Найти по ID</button>
            </form>

            <form th:action="@{/admin/users}" method="get" class="search-form-inline">
                <input type="email" class="form-control" placeholder="Email пользователя" name="email" required>
                <button type="submit" class="btn-submit">Найти по Email</button>
            </form>

            <a th:href="@{/admin/users}" class="btn-reset">Сбросить поиск</a>
        </div>
    </div>

    <!-- Таблица результатов -->
    <div class="table-container" th:if="${users != null and !users.isEmpty()}">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Email</th>
                <th>Текущая роль</th>
                <th>Регистрация</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td style="font-weight: 600; color: #8e8e93;" th:text="${'#' + user.id}">#1</td>
                <td style="font-weight: 600;" th:text="${user.name}">Имя</td>
                <td style="color: #636366;" th:text="${user.email}">user@example.com</td>
                <td>
                    <span style="background-color: #f2f2f7; padding: 4px 8px; border-radius: 6px; font-weight: 600; font-size: 12px;"
                          th:text="${user.role}">ROLE_USER</span>
                </td>
                <td style="color: #8e8e93;"
                    th:text="${user.registeredAt != null ? #temporals.format(user.registeredAt, 'dd.MM.yyyy HH:mm') : '—'}">
                    —
                </td>
                <td>
                    <form th:action="@{/admin/users/update}" method="post" class="role-form">
                        <input type="hidden" name="id" th:value="${user.id}"/>
                        <select name="role" class="select-role">
                            <option th:each="r : ${roles}"
                                    th:value="${r}"
                                    th:text="${r}"
                                    th:selected="${r == user.role}">
                            </option>
                        </select>
                        <button type="submit" class="btn-update-role">Изменить роль</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${users == null or users.isEmpty()}"
         style="text-align: center; padding: 40px; background: #ffffff; border-radius: 12px; border: 1px solid #e5e5ea; color: #8e8e93;">
        Пользователи не найдены или запрос не выполнен.
    </div>

</main>

</body>
</html>
