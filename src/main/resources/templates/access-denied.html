<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 — Доступ ограничен | Город N</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/admin.css">
</head>
<body>

<aside class="sidebar">
    <a th:href="@{/}" class="sidebar-logo">
        ГОРОД N <span class="sidebar-badge">СЕРВИС</span>
    </a>
    <div class="sidebar-footer" sec:authorize="isAuthenticated()">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-btn">Выйти</button>
        </form>
    </div>
</aside>

<main class="main-content">

    <div class="top-bar">
        <div class="page-title">Город N — Ошибка доступа</div>
        <div class="user-info" sec:authorize="isAuthenticated()">
            <div class="user-details">
                <div class="user-name" th:text="${currentUser?.name ?: #authentication?.name ?: 'Пользователь'}">
                    Пользователь
                </div>
                <div class="user-role"
                     th:text="${#authentication?.getAuthorities()?.get(0)?.getAuthority() ?: 'Гость'}">
                    Пользователь
                </div>
            </div>
            <div class="user-avatar"
                 th:text="${currentUser?.name != null ? #strings.substring(currentUser.name, 0, 1) : 'U'}">
                U
            </div>
        </div>
    </div>

    <div class="error-container">
        <div class="error-card">
            <div class="error-badge">🔒</div>
            <div class="error-code">Ошибка 403</div>
            <h1 class="error-title">Доступ ограничен</h1>
            <p class="error-description">
                У вашей учетной записи недостаточно прав для просмотра этой страницы. Обратитесь к администратору, если
                считаете, что это ошибка.
            </p>
            <div class="btn-group">
                <a href="javascript:history.back()" class="btn btn-secondary">Назад</a>
                <a th:href="@{/}" class="btn btn-primary">На главную</a>
            </div>
        </div>
    </div>

</main>

</body>
</html>
