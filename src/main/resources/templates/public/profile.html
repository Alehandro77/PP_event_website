<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет — Город N</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="header">
    <a th:href="@{/}" class="logo">
        ГОРОД N <span class="logo-badge">АФИША</span>
    </a>

    <div class="user-menu">
        <span class="user-name">
            <span class="status-dot"></span>
            <span th:text="${user.name}">Пользователь</span>
        </span>
        <a th:href="@{/user/profile}" class="nav-link-item">Личный кабинет</a>
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit" class="nav-link-item"
                    style="background: none; border: none; padding: 0; cursor: pointer;">Выход
            </button>
        </form>
    </div>
</header>

<main class="main-container">
    <h1 class="page-title">Личный кабинет</h1>

    <div class="profile-card">
        <div class="profile-name" th:text="${user.name}">Turik</div>
        <p class="profile-email" th:text="'E-mail: ' + ${user.email}">E-mail: user@example.com</p>
    </div>

    <h2 class="section-title">Мои мероприятия</h2>

    <div class="events-grid" th:if="${events != null and !#lists.isEmpty(events)}">
        <div class="event-card" th:each="event : ${events}">
            <div class="event-card-body">
                <a th:href="@{/public/events/{id}(id=${event.id})}"
                   class="event-title"
                   th:text="${event.title}">
                    Название события
                </a>

                <div class="event-meta">
                    <div th:text="${event.location}">Локация</div>
                    <div>
                        <span th:text="${event.eventDate != null ? #temporals.format(event.eventDate, 'dd MMMM yyyy') : ''}">Дата</span>
                        <span th:text="${event.eventTime != null ? #temporals.format(event.eventTime, 'HH:mm') : ''}">Время</span>
                    </div>
                </div>

                <form th:action="@{/user/profile/deleteReg}" method="post">
                    <input type="hidden" name="eventId" th:value="${event.id}">
                    <button type="submit" class="btn-cancel">Отменить запись</button>
                </form>
            </div>
        </div>

        <div class="empty-state" th:if="${events == null or #lists.isEmpty(events)}">
            <p class="m-0">Вы пока не зарегистрированы ни на одно мероприятие.</p>
        </div>
</main>

</body>
</html>
